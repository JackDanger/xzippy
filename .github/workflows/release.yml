name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag exists on main
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if ! git branch -r --contains "refs/tags/$TAG" | grep -q 'origin/main'; then
            echo "::error::Tag $TAG is not reachable from origin/main"
            exit 1
          fi

      - name: Verify tag matches Cargo.toml version
        run: |
          VER="${{ steps.resolve.outputs.version }}"
          CARGO_VER=$(grep -E '^version *= *"' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$VER" != "$CARGO_VER" ]; then
            echo "::error::Tag v$VER does not match Cargo.toml version $CARGO_VER"
            exit 1
          fi
          echo "Releasing $CARGO_VER"

  crates-io:
    name: Publish to crates.io
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-release-${{ hashFiles('**/Cargo.toml') }}

      - name: Check if version already published
        id: already-published
        run: |
          VER=$(grep -E '^version *= *"' Cargo.toml | head -1 | cut -d'"' -f2)
          if cargo search xzippy --limit 1 2>/dev/null | grep -q "xzippy = \"$VER\""; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version $VER already on crates.io — skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.already-published.outputs.published != 'true'
        run: |
          for attempt in 1 2 3; do
            cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "Attempt $attempt failed, retrying in 15s…"
            sleep 15
          done

  github-release:
    name: Create GitHub Release
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        run: |
          gh release create "${{ steps.resolve.outputs.tag }}" \
            --title "${{ steps.resolve.outputs.tag }}" \
            --generate-notes \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
