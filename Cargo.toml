[package]
name = "xzippy"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust .xz format (LZMA2). Drop-in replacement for xz/unxz/xzcat. Part of the 7zippy umbrella."
license = "Zlib"
repository = "https://github.com/JackDanger/xzippy"
authors = ["Jack Danger Canty"]
build = "build.rs"

[dependencies]
thiserror = "1"
# Phase 1 wrapper backend: lzma-rust2 provides a full pure-Rust LZMA2 encoder + decoder.
# Phase 2 will replace this with xzippy's own native range-coder + chunk orchestration.
lzma-rust2 = { version = "0.16", features = ["encoder"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "encode"
harness = false
